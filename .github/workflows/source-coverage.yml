name: Discover official P94 sources
on:
  schedule:
    - cron: '33 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/check_sources.py', 'scripts/discover_sources.py', '.github/workflows/source-coverage.yml']
permissions:
  contents: write
concurrency:
  group: official-source-checks
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh official directory
        run: |
          if [ "$(date -u +%H)" = "00" ] || [ ! -f public/p94/directory.json ]; then python3 scripts/discover_sources.py; fi
      - name: Inspect next institutions
        run: python3 scripts/check_sources.py
      - name: Save durable coverage and candidate queue
        run: |
          git config user.name "P94 source monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/p94/directory.json public/p94/monitor.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh source coverage and recruitment leads"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
